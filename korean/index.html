<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2aa98"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>ProInt Medical Assistant – English ↔ Korean Mobile</title><style>html,body{margin:0;background:#fff8f4;color:#5d2f2a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.loader{max-width:420px}.spinner{width:46px;height:46px;margin:0 auto 16px;border:5px solid #f7d8cf;border-top-color:#ef9f8c;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{border:0;border-radius:14px;background:#ef9f8c;color:#fff;padding:12px 18px;font:inherit;font-weight:700}</style><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div id="app"><div class="loader"><div class="spinner"></div><h2>Loading ProInt Mobile…</h2><p>Optimized for iPhone, iPad and Android.</p></div></div><script>(async()=>{const root=document.getElementById('app');try{const urls=['./_mobile/c00.txt?v=mobile1','./_mobile/c01.txt?v=mobile1','./_mobile/c02.txt?v=mobile1'];const parts=await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('Missing mobile payload');return r.text()}));const b64=parts.join('');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html='';if(window.pako){html=new TextDecoder().decode(window.pako.ungzip(bin))}else if('DecompressionStream'in window){const ds=new DecompressionStream('gzip');html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text()}else{throw new Error('This browser cannot unpack the app')}document.open();document.write(html);document.close()}catch(e){console.error(e);root.innerHTML='<div class="loader"><h2>Unable to load the mobile version</h2><p>Please refresh once. If it still does not open, use the latest Safari or Chrome.</p><button onclick="location.reload()">Refresh</button></div>'}})();</script></body></html>
